<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>We Sold Our Souls · Reader</title>
<!-- Guitar icon, drawn here rather than shipped as a file so the reader stays
     one file the student can open, edit and hand around. -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cpath fill='%23e8503a' d='M40 6l6 6-8 8 4 4-9 9a13 13 0 11-6-6l9-9-4-4 8-8zM22 38a7 7 0 100 14 7 7 0 000-14zm0 4a3 3 0 110 6 3 3 0 010-6z'/%3E%3C/svg%3E">
<style>
  :root{
    --bg:#0b0b0d; --panel:#141417; --line:#26262b; --ink:#ece9e4;
    --dim:#8d8a86; --hot:#e8503a; --zh:#7fd4c1;
    --serif:"Iowan Old Style","Palatino Linotype",Georgia,serif;
    --han:"Noto Serif TC","Source Han Serif TC","PMingLiU",serif;
    --size:20px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg); color:var(--ink); font-family:var(--serif);
    -webkit-text-size-adjust:100%;
  }
  a{color:var(--hot)}
  .wrap{max-width:46rem;margin:0 auto;padding:0 16px}

  /* ---------- library ---------- */
  #library{display:block}
  .hero{position:relative;padding:40px 0 28px;display:flex;gap:28px;align-items:flex-start}
  .hero img{
    width:210px;flex:0 0 210px;border-radius:4px;display:block;
    box-shadow:0 18px 50px rgba(0,0,0,.65), 0 0 0 1px #000;
  }
  .hero h1{font-size:2.1rem;line-height:1.1;margin:.1em 0 .1em}
  .hero .zh{font-family:var(--han);color:var(--zh);font-size:1.25rem;margin:0 0 .5em}
  .hero .by{color:var(--dim);margin:0 0 1em;font-size:1rem}
  .hero .note{color:var(--dim);font-size:.85rem;line-height:1.5;max-width:22rem}
  .brand{display:flex;align-items:center;gap:10px;padding-top:22px}
  .brand svg{width:26px;height:26px;fill:var(--hot)}
  .brand span{letter-spacing:.22em;text-transform:uppercase;font-size:.7rem;color:var(--dim)}

  .chapters{list-style:none;margin:8px 0 60px;padding:0;
    display:grid;grid-template-columns:repeat(auto-fill,minmax(15rem,1fr));gap:1px;
    background:var(--line);border:1px solid var(--line)}
  .chapters li{background:var(--panel)}
  .chapters button{
    width:100%;text-align:left;background:none;border:0;color:inherit;
    font:inherit;padding:14px 16px;cursor:pointer;display:flex;gap:12px;align-items:baseline;
  }
  .chapters button:hover{background:#1b1b1f}
  .chapters .n{color:var(--hot);font-size:.8rem;min-width:1.6em;font-variant-numeric:tabular-nums}
  .chapters .t{flex:1}
  .chapters .meta{color:var(--dim);font-size:.72rem;white-space:nowrap}
  .chapters .done{color:var(--zh)}

  /* ---------- toolbar ---------- */
  #bar{position:sticky;top:0;z-index:5;background:rgba(11,11,13,.94);
    backdrop-filter:blur(8px);border-bottom:1px solid var(--line);display:none}
  #bar .wrap{display:flex;align-items:center;gap:8px;height:48px}
  #bar .ttl{flex:1;font-size:.85rem;color:var(--dim);white-space:nowrap;
    overflow:hidden;text-overflow:ellipsis}
  .btn{background:none;border:1px solid var(--line);color:var(--dim);
    font:inherit;font-size:.75rem;border-radius:3px;padding:5px 9px;cursor:pointer}
  .btn:hover{color:var(--ink);border-color:#3a3a40}
  .btn.on{color:var(--bg);background:var(--hot);border-color:var(--hot)}

  /* ---------- reader ---------- */
  #reader{display:none;padding-bottom:45vh}
  .chead{padding:38px 0 26px;border-bottom:1px solid var(--line);margin-bottom:26px}
  .chead .n{color:var(--hot);letter-spacing:.2em;font-size:.72rem;text-transform:uppercase}
  .chead h2{font-size:1.9rem;margin:.25em 0 .1em;line-height:1.15}
  .chead .zh{font-family:var(--han);color:var(--zh);font-size:1rem;margin:0}
  #body p{font-size:var(--size);line-height:1.66;margin:0 0 1.15em;text-align:left}
  #body p:first-of-type::first-letter{
    float:left;font-size:3.1em;line-height:.82;padding:.06em .09em 0 0;color:var(--hot);
  }
  .sent{cursor:pointer;border-radius:2px;transition:background .12s}
  .sent:hover{background:#1e1e23}
  .sent.sel{background:#2c1a16;box-shadow:0 0 0 1px #45231c}
  .sent.playing{background:#33201a}
  .w.on{color:var(--hot)}
  .zhline{display:block;font-family:var(--han);color:var(--zh);font-size:calc(var(--size) * .82);
    line-height:1.7;margin:.35em 0 0;padding-left:.8em;border-left:2px solid #24443d}
  .untranslated{color:var(--dim);font-style:italic}
  .nav{display:flex;justify-content:space-between;gap:12px;margin:40px 0 20px}

  /* ---------- sentence sheet ---------- */
  #sheet{position:fixed;left:0;right:0;bottom:0;z-index:9;transform:translateY(102%);
    transition:transform .18s ease-out;background:var(--panel);
    border-top:1px solid var(--line);box-shadow:0 -20px 50px rgba(0,0,0,.6);
    max-height:52vh;overflow:auto}
  #sheet.open{transform:none}
  #sheet .wrap{padding:16px 16px 22px}
  #sheet .en{font-size:1.02rem;line-height:1.6;margin:0 0 .6em}
  #sheet .en .w{cursor:pointer;border-radius:2px}
  #sheet .en .w:hover{background:#2a2a30}
  #sheet .zh{font-family:var(--han);color:var(--zh);font-size:1.12rem;line-height:1.7;margin:0}
  #sheet .row{display:flex;gap:8px;align-items:center;margin-top:14px}
  #sheet .x{position:absolute;right:10px;top:8px}
  .gloss{margin-top:12px;padding-top:12px;border-top:1px solid var(--line);
    font-size:.92rem;display:none}
  .gloss b{color:var(--ink)}
  .gloss .ipa{color:var(--dim);font-family:var(--serif);margin-left:.4em}
  .gloss .zh{font-family:var(--han);color:var(--zh);display:block;margin-top:.25em;font-size:1.05rem}
  .btn:disabled{opacity:.35;cursor:default}

  /* ---------- view modes: Segment · Sentence · Paragraph · Chapter ---------- */
  #bar .modes{height:auto;padding-bottom:8px;gap:4px}
  #bar .modes .btn{flex:1}
  #step{display:none;padding:6px 0 30px;touch-action:pan-y}
  #step .en{font-size:calc(var(--size) * 1.2);line-height:1.6;margin:0 0 .7em;min-height:3.2em}
  #step .en .w{cursor:pointer;border-radius:2px}
  #step .en .w:hover{background:#2a2a30}
  #step .zh{font-family:var(--han);color:var(--zh);font-size:calc(var(--size) * 1.02);
    line-height:1.75;margin:0}
  .ctl{display:flex;align-items:center;justify-content:space-between;gap:10px;
    margin-top:18px;flex-wrap:wrap}
  .ctl .pos{color:var(--dim);font-size:.8rem}
  .ctl input[type=number]{width:4.2em;background:var(--panel);color:var(--ink);
    border:1px solid var(--line);border-radius:3px;font:inherit;font-size:.8rem;padding:3px 5px}
  .ctl label{color:var(--dim);font-size:.75rem;display:flex;align-items:center;gap:6px}

  @media (max-width:640px){
    .hero{flex-direction:column;gap:18px;padding-top:26px}
    .hero img{width:56%;max-width:210px;flex:none}
    :root{--size:19px}
  }
</style>
</head>
<body>

<div id="library">
  <div class="wrap">
    <div class="brand">
      <svg viewBox="0 0 64 64" aria-hidden="true"><path d="M40 6l6 6-8 8 4 4-9 9a13 13 0 11-6-6l9-9-4-4 8-8zM22 38a7 7 0 100 14 7 7 0 000-14zm0 4a3 3 0 110 6 3 3 0 010-6z"/></svg>
      <span>Souls Reader</span>
    </div>
    <div class="hero">
      <img id="cover" src="cover.jpg" alt="Cover of We Sold Our Souls">
      <div>
        <h1 id="btitle">&nbsp;</h1>
        <p class="zh" id="bzh"></p>
        <p class="by" id="bby"></p>
        <p class="note">
          Read a segment, a sentence, a paragraph or the whole chapter at a time.
          Tap any word for its pronunciation and Chinese gloss. Where narration
          exists, each piece plays on its own and the words light up as they are
          spoken.
        </p>
      </div>
    </div>
    <ul class="chapters" id="chapters"></ul>
  </div>
</div>

<div id="bar">
  <div class="wrap">
    <button class="btn" id="back">&larr; Chapters</button>
    <span class="ttl" id="bartitle"></span>
    <button class="btn" id="tzh" title="Show the Chinese under every paragraph">中</button>
    <button class="btn" id="smaller">A&minus;</button>
    <button class="btn" id="bigger">A+</button>
  </div>
  <div class="wrap modes" id="modes">
    <button class="btn" data-mode="segment">Segment</button>
    <button class="btn" data-mode="sentence">Sentence</button>
    <button class="btn" data-mode="paragraph">Paragraph</button>
    <button class="btn" data-mode="story">Chapter</button>
  </div>
</div>

<div id="reader">
  <div class="wrap">
    <div class="chead">
      <div class="n" id="cnum"></div>
      <h2 id="ctitle"></h2>
      <p class="zh" id="czh"></p>
    </div>
    <div id="step">
      <p class="en" id="sten"></p>
      <p class="zh" id="stzh"></p>
      <div class="gloss" id="sgloss"></div>
      <div class="ctl">
        <button class="btn" id="sprev">&lsaquo; Previous</button>
        <span class="pos"><input type="number" id="sjump" min="1"> / <span id="stot"></span></span>
        <button class="btn" id="snext">Next &rsaquo;</button>
      </div>
      <div class="ctl">
        <button class="btn" id="splay">&#9654; Play</button>
        <button class="btn" id="stzhbtn">Translation</button>
        <label>Speed <input type="range" id="speed" min="0.5" max="1" step="0.05">
          <span id="speedv"></span></label>
      </div>
    </div>
    <div id="body"></div>
    <div class="nav">
      <button class="btn" id="prev">&larr; Previous</button>
      <button class="btn" id="next">Next &rarr;</button>
    </div>
  </div>
</div>

<div id="sheet">
  <div class="wrap">
    <button class="btn x" id="close">&times;</button>
    <p class="en" id="sen"></p>
    <p class="zh" id="szh"></p>
    <div class="row">
      <button class="btn" id="play">&#9654; Play</button>
      <span class="ttl" id="audionote" style="color:var(--dim);font-size:.75rem"></span>
    </div>
    <div class="gloss" id="gloss"></div>
  </div>
</div>

<audio id="au" preload="none"></audio>

<script>
// ---------------------------------------------------------------------------
// A whole reader in one file: no build step, no framework, no server beyond a
// static one. It reads exactly the pack format the pipeline writes, so the same
// JSON drops into the React app later without a conversion step.
//
//   cd public && python -m http.server 8000   ->   http://localhost:8000
//
// Four views, as in germanic-literature: Segment, Sentence and Paragraph step
// through the chapter one unit at a time; Chapter is the continuous text.
// Switching view keeps your place, anchored on a sentence id.
// ---------------------------------------------------------------------------
const $ = s => document.querySelector(s);
const MODES = ['segment', 'sentence', 'paragraph', 'story'];
const state = {reg:null, dict:null, pack:null, idx:0, sent:null, showZh:false,
               mode:'sentence', units:null, pos:0, anchor:null, stepZh:true, rate:1};

const LS = {
  get: (k, d) => { try { return JSON.parse(localStorage.getItem('souls.'+k)) ?? d; }
                   catch (e) { return d; } },
  set: (k, v) => { try { localStorage.setItem('souls.'+k, JSON.stringify(v)); }
                   catch (e) {} },
};

// Chapter titles arrive as "We Sold Our Souls · True As Steel"; the reader has
// the book title everywhere already, so only the part after the dot is wanted.
const shortTitle = t => t.includes(' · ') ? t.split(' · ').pop() : t;

async function boot() {
  state.reg = await (await fetch('texts/registry.json')).json();
  // The dictionary is a later pipeline stage; the reader must work without it.
  try { state.dict = await (await fetch('dict.json')).json(); } catch (e) { state.dict = null; }

  const work = state.reg.works[0];
  $('#btitle').textContent = work.title;
  $('#bzh').textContent = work.zh || '';
  $('#bby').textContent = work.author;
  if (work.cover) $('#cover').src = work.cover;
  document.title = work.title + ' · Reader';

  const ul = $('#chapters');
  state.reg.chapters.forEach((c, i) => {
    const li = document.createElement('li');
    const b = document.createElement('button');
    b.innerHTML = `<span class="n">${String(i + 1).padStart(2, '0')}</span>`
                + `<span class="t">${shortTitle(c.title)}</span>`
                + `<span class="meta">${c.sents} sent.</span>`;
    b.onclick = () => open(i);
    li.appendChild(b);
    ul.appendChild(li);
  });

  const size = LS.get('size', null);
  if (size) document.documentElement.style.setProperty('--size', size + 'px');
  state.showZh = LS.get('showZh', false);
  $('#tzh').classList.toggle('on', state.showZh);
  state.stepZh = LS.get('stepZh', true);
  $('#stzhbtn').classList.toggle('on', state.stepZh);
  state.rate = LS.get('rate', 1);
  $('#speed').value = state.rate;
  $('#speedv').textContent = state.rate.toFixed(2) + '×';
  const m = LS.get('mode', 'sentence');
  state.mode = MODES.includes(m) ? m : 'sentence';

  const last = LS.get('last', null);
  if (last !== null && state.reg.chapters[last]) open(last);
}

// ---------------------------------------------------------------------------
// Units. Every unit carries `parts` (what plays, in order), `sids` (the
// sentence ids it covers) and `sentenceId` (where it anchors when you switch).
// A sentence with no segments is its own single segment, as in germanic.
// ---------------------------------------------------------------------------
function buildUnits(pack) {
  const segment = [], sentence = [], paragraph = [];
  pack.paragraphs.forEach((p, pi) => {
    const ss = p.sentences;
    for (const s of ss) {
      sentence.push({id: s.id, sentenceId: s.id, sids: [s.id], parts: [s],
                     translation: s.translation});
      const gs = s.segments && s.segments.length ? s.segments : [s];
      for (const g of gs)
        segment.push({id: g.id, sentenceId: s.id, sids: [s.id], parts: [g],
                      translation: g.translation || (gs.length === 1 ? s.translation : null)});
    }
    if (ss.length) {
      const zh = ss.filter(s => s.translation).map(s => s.translation).join('');
      paragraph.push({id: 'para_' + pi, sentenceId: ss[0].id, sids: ss.map(s => s.id),
                      parts: ss, translation: zh || null});
    }
  });
  return {segment, sentence, paragraph};
}

const unitsNow = () => state.units[state.mode] || [];
const firstSid = () => state.pack.paragraphs[0]?.sentences[0]?.id || null;

function setAnchor(sid) {
  if (!sid) return;
  state.anchor = sid;
  const pos = LS.get('pos', {});
  pos[state.pack.id] = sid;
  LS.set('pos', pos);
}

async function open(i) {
  const c = state.reg.chapters[i];
  if (!c) return;
  stop();
  state.idx = i;
  state.pack = await (await fetch(`texts/${c.id}.json`)).json();
  state.units = buildUnits(state.pack);
  state.anchor = LS.get('pos', {})[state.pack.id] || firstSid();
  LS.set('last', i);

  $('#cnum').textContent = `Chapter ${String(i + 1).padStart(2, '0')}`;
  $('#ctitle').textContent = shortTitle(state.pack.title);
  $('#czh').textContent = state.pack.titleTranslation || '';
  $('#bartitle').textContent = shortTitle(state.pack.title);
  $('#library').style.display = 'none';
  $('#reader').style.display = 'block';
  $('#bar').style.display = 'block';
  $('#prev').disabled = i === 0;
  $('#next').disabled = i === state.reg.chapters.length - 1;
  render();
  closeSheet();
  window.scrollTo(0, 0);
  setMode(state.mode, true);
}

function setMode(mode, fresh) {
  // Leaving the chapter view: the place is the sentence at the top of the screen.
  if (!fresh && state.mode === 'story' && !state.sent) {
    const bar = $('#bar').getBoundingClientRect().bottom;
    const top = [...document.querySelectorAll('#body .sent')]
      .find(e => e.getBoundingClientRect().bottom > bar + 4);
    if (top) setAnchor(top.dataset.id);
  }
  stop();
  closeSheet();
  state.mode = mode;
  LS.set('mode', mode);
  document.querySelectorAll('#modes .btn').forEach(b =>
    b.classList.toggle('on', b.dataset.mode === mode));

  const story = mode === 'story';
  $('#step').style.display = story ? 'none' : 'block';
  $('#body').style.display = story ? 'block' : 'none';
  if (story) {
    const el = state.anchor && state.anchor !== firstSid()
      && document.querySelector(`#body .sent[data-id="${state.anchor}"]`);
    if (el) {
      const y = el.getBoundingClientRect().top + window.scrollY - $('#bar').offsetHeight - 16;
      window.scrollTo(0, y);
    }
    return;
  }
  const i = unitsNow().findIndex(u => u.sids.includes(state.anchor));
  goTo(i < 0 ? 0 : i, false);
}

// ---------------------------------------------------------------------------
// Chapter view
// ---------------------------------------------------------------------------
function render() {
  const body = $('#body');
  body.textContent = '';
  for (const para of state.pack.paragraphs) {
    const p = document.createElement('p');
    for (const s of para.sentences) {
      const span = document.createElement('span');
      span.className = 'sent';
      span.dataset.id = s.id;
      // Words are their own spans so forced-alignment timings have something to
      // highlight; the trailing space lives inside the span, as in the pack.
      for (const w of s.words) {
        const ws = document.createElement('span');
        ws.className = 'w';
        ws.textContent = w.text;
        span.appendChild(ws);
      }
      span.onclick = () => select(s, span);
      p.appendChild(span);
    }
    if (state.showZh) {
      const zh = document.createElement('span');
      zh.className = 'zhline';
      const done = para.sentences.filter(s => s.translation);
      if (done.length) zh.textContent = done.map(s => s.translation).join('');
      else { zh.className += ' untranslated'; zh.textContent = 'Not translated yet.'; }
      p.appendChild(zh);
    }
    body.appendChild(p);
  }
}

// Words as tappable spans; returns the spans so playback can light them up.
function wordRow(el, words, box) {
  el.textContent = '';
  return words.map(w => {
    const ws = document.createElement('span');
    ws.className = 'w';
    ws.textContent = w.text;
    ws.onclick = () => glossFor(w.text, box);
    el.appendChild(ws);
    return ws;
  });
}

function select(s, span) {
  stop();
  document.querySelectorAll('.sent.sel').forEach(e => e.classList.remove('sel'));
  span.classList.add('sel');
  setAnchor(s.id);
  state.sent = {data: s, el: span, els: wordRow($('#sen'), s.words, $('#gloss'))};

  const zh = $('#szh');
  if (s.translation) { zh.textContent = s.translation; zh.classList.remove('untranslated'); }
  else { zh.textContent = 'Not translated yet — run scripts/translate.py.';
         zh.classList.add('untranslated'); }

  const src = s.src || s.audio;
  $('#play').style.display = src ? '' : 'none';
  $('#audionote').textContent = src ? '' : 'No narration yet — run scripts/narrate.py.';
  $('#gloss').style.display = 'none';
  $('#sheet').classList.add('open');
}

function closeSheet() {
  $('#sheet').classList.remove('open');
  document.querySelectorAll('.sent.sel').forEach(e => e.classList.remove('sel'));
  if (state.sent) stop();
  state.sent = null;
}

function playSheet() {
  const s = state.sent;
  if (!s) return;
  s.el.classList.add('playing');
  playParts([s.data], s.els, null, $('#audionote'));
}

// ---------------------------------------------------------------------------
// Stepper views: one segment / sentence / paragraph at a time
// ---------------------------------------------------------------------------
function goTo(i, autoplay = true) {
  const us = unitsNow();
  if (!us.length) return;
  i = Math.max(0, Math.min(us.length - 1, i));
  stop();
  state.pos = i;
  const u = us[i];
  setAnchor(u.sentenceId);

  state.stepEls = wordRow($('#sten'), u.parts.flatMap(p => p.words), $('#sgloss'));
  const zh = $('#stzh');
  zh.style.display = state.stepZh ? '' : 'none';
  zh.textContent = u.translation || 'Not translated yet.';
  zh.classList.toggle('untranslated', !u.translation);
  $('#sgloss').style.display = 'none';
  $('#sjump').value = i + 1;
  $('#sjump').max = us.length;
  $('#stot').textContent = us.length;
  $('#sprev').disabled = i === 0;
  $('#snext').disabled = i === us.length - 1;
  $('#splay').disabled = !u.parts.some(p => p.src || p.audio);
  if (autoplay) playUnit();
}

function playUnit() {
  const u = unitsNow()[state.pos];
  if (!u) return;
  // In paragraph view the anchor follows the sentence actually being read.
  playParts(u.parts, state.stepEls, k => {
    if (state.mode === 'paragraph') setAnchor(u.parts[k].id);
  });
}

// ---------------------------------------------------------------------------
// Dictionary. Keys are bare lowercase words; what is clicked carries the
// punctuation and spacing of the running text. A miss tries the obvious
// inflections before giving up.
// ---------------------------------------------------------------------------
function lookup(key) {
  const d = state.dict;
  if (!d) return null;
  if (d[key]) return [key, d[key]];
  const tries = [key.replace(/['’]s$/, ''), key.replace(/['’]$/, ''),
                 key.replace(/ies$/, 'y'), key.replace(/es$/, ''), key.replace(/s$/, ''),
                 key.replace(/ied$/, 'y'), key.replace(/ed$/, ''), key.replace(/d$/, ''),
                 key.replace(/ing$/, ''), key.replace(/ing$/, 'e'),
                 key.replace(/(.)\1ing$/, '$1'), key.replace(/(.)\1ed$/, '$1')];
  for (const k of tries) if (k !== key && d[k]) return [k, d[k]];
  return null;
}

function glossFor(raw, box) {
  const key = raw.toLowerCase().replace(/[^a-z'’-]/g, '').replace(/^[-'’]+|-+$/g, '');
  if (!key) { box.style.display = 'none'; return; }
  box.style.display = 'block';
  const hit = lookup(key);
  if (!hit) {
    box.innerHTML = `<b>${key}</b> <span class="ipa">`
      + (state.dict ? 'not in the dictionary yet' : 'dictionary not built yet — run scripts/build_dict.py')
      + '</span>';
    return;
  }
  const [k, e] = hit;
  box.innerHTML = `<b>${k}</b><span class="ipa">${e.ipa ? '/' + e.ipa + '/' : ''}</span>`
                + `<span class="zh">${e.zh || ''}</span>`;
}

// ---------------------------------------------------------------------------
// Audio. One mp3 per chapter; a unit plays exactly its own [start, end] and
// stops. The file is fetched once as a blob: `python -m http.server` does not
// answer Range requests, so a plain URL cannot seek and every play would start
// at 0:00. A blob seeks anywhere, whatever serves it.
// ---------------------------------------------------------------------------
const au = $('#au');
const blobs = {};
let raf = 0, clip = null, token = 0;

function audioUrl(src) {
  const url = /^https?:|^\//.test(src) ? src : 'audio/' + src;
  if (!blobs[url]) blobs[url] = fetch(url)
    .then(r => { if (!r.ok) throw new Error(r.status); return r.blob(); })
    .then(b => URL.createObjectURL(b))
    .catch(e => { delete blobs[url]; throw e; });
  return blobs[url];
}

async function load(src) {
  const url = await audioUrl(src);
  if (au.src !== url) {
    au.src = url;
    await new Promise((ok, bad) => {
      au.addEventListener('loadedmetadata', ok, {once: true});
      au.addEventListener('error', bad, {once: true});
    });
  }
}

// parts: things with src/start/end/words, played in order.
// els: one span per word across all parts, for the highlight.
async function playParts(parts, els, onPart, note) {
  stop();
  parts = parts.filter(p => p.src || p.audio);
  if (!parts.length) return;
  const my = ++token;
  const words = [];
  parts.forEach(p => p.words.forEach(w => words.push({w, el: els[words.length]})));
  clip = {parts, k: 0, words, onPart, els};
  setPlayLabels(true);
  try { await startPart(0, my); }
  catch (e) {
    if (my === token) { stop(); if (note) note.textContent = 'Could not load the narration.'; }
  }
}

async function startPart(k, my) {
  const p = clip.parts[k];
  await load(p.src || p.audio);
  if (my !== token || !clip) return;
  clip.k = k;
  au.defaultPlaybackRate = au.playbackRate = state.rate;
  au.currentTime = p.start ?? 0;
  if (clip.onPart) clip.onPart(k);
  await au.play();
  tick();
}

function tick() {
  cancelAnimationFrame(raf);
  if (!clip) return;
  const t = au.currentTime;
  const p = clip.parts[clip.k];
  if (p.end != null && t >= p.end) {
    if (clip.k + 1 < clip.parts.length) {
      const n = clip.parts[clip.k + 1];
      // Consecutive sentences sit back to back in the chapter file: carry on
      // without a seek unless there is a real gap.
      if ((n.src || n.audio) === (p.src || p.audio) && Math.abs((n.start ?? t) - t) < 0.35) {
        clip.k++;
        if (clip.onPart) clip.onPart(clip.k);
      } else { startPart(clip.k + 1, token).catch(stop); return; }
    } else { stop(); return; }
  }
  for (const {w, el} of clip.words)
    if (el) el.classList.toggle('on', w.start != null && t >= w.start && t < w.end);
  raf = requestAnimationFrame(tick);
}

function stop() {
  cancelAnimationFrame(raf);
  token++;
  if (clip) clip.els.forEach(e => e && e.classList.remove('on'));
  clip = null;
  au.pause();
  document.querySelectorAll('.playing').forEach(e => e.classList.remove('playing'));
  setPlayLabels(false);
}

// Pause keeps the place in the unit; play again resumes rather than restarts.
function togglePlay(start) {
  if (clip && !au.paused) { au.pause(); cancelAnimationFrame(raf); setPlayLabels(false); return; }
  if (clip && au.paused) { au.play(); setPlayLabels(true); tick(); return; }
  start();
}

function setPlayLabels(on) {
  const t = on ? '&#10074;&#10074; Pause' : '&#9654; Play';
  $('#play').innerHTML = t;
  $('#splay').innerHTML = t;
}

au.onended = stop;

// ---------------------------------------------------------------------------
// Chrome
// ---------------------------------------------------------------------------
$('#play').onclick = () => togglePlay(playSheet);
$('#splay').onclick = () => togglePlay(playUnit);
$('#close').onclick = closeSheet;
$('#sprev').onclick = () => goTo(state.pos - 1);
$('#snext').onclick = () => goTo(state.pos + 1);
$('#sjump').onchange = e => goTo(parseInt(e.target.value, 10) - 1);
$('#stzhbtn').onclick = () => {
  state.stepZh = !state.stepZh;
  LS.set('stepZh', state.stepZh);
  $('#stzhbtn').classList.toggle('on', state.stepZh);
  $('#stzh').style.display = state.stepZh ? '' : 'none';
};
$('#speed').oninput = e => {
  state.rate = parseFloat(e.target.value);
  au.defaultPlaybackRate = au.playbackRate = state.rate;
  $('#speedv').textContent = state.rate.toFixed(2) + '×';
  LS.set('rate', state.rate);
};
document.querySelectorAll('#modes .btn').forEach(b =>
  b.onclick = () => { if (b.dataset.mode !== state.mode) setMode(b.dataset.mode); });

// Swipe between units, as on a phone.
let touch = null;
$('#step').addEventListener('touchstart', e => {
  const t = e.changedTouches[0]; touch = {x: t.clientX, y: t.clientY};
}, {passive: true});
$('#step').addEventListener('touchend', e => {
  if (!touch) return;
  const t = e.changedTouches[0], dx = t.clientX - touch.x, dy = t.clientY - touch.y;
  touch = null;
  if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy) * 1.5) goTo(state.pos + (dx < 0 ? 1 : -1));
}, {passive: true});

$('#back').onclick = () => {
  closeSheet();
  stop();
  $('#library').style.display = 'block';
  $('#reader').style.display = 'none';
  $('#bar').style.display = 'none';
};
$('#prev').onclick = () => open(state.idx - 1);
$('#next').onclick = () => open(state.idx + 1);
$('#tzh').onclick = () => {
  state.showZh = !state.showZh;
  LS.set('showZh', state.showZh);
  $('#tzh').classList.toggle('on', state.showZh);
  render();
};
function resize(d) {
  const cur = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--size'));
  const next = Math.min(30, Math.max(15, cur + d));
  document.documentElement.style.setProperty('--size', next + 'px');
  LS.set('size', next);
}
$('#bigger').onclick = () => resize(1);
$('#smaller').onclick = () => resize(-1);
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeSheet();
  if ($('#reader').style.display !== 'block') return;
  if (e.target.tagName === 'INPUT' && e.target.type === 'number') return;
  const step = state.mode !== 'story';
  if (e.key === ' ') {
    e.preventDefault();
    if (step) togglePlay(playUnit);
    else if (state.sent) togglePlay(playSheet);
  } else if (e.key === 'ArrowRight') {
    if (step) goTo(state.pos + 1);
    else if (state.idx < state.reg.chapters.length - 1) open(state.idx + 1);
  } else if (e.key === 'ArrowLeft') {
    if (step) goTo(state.pos - 1);
    else if (state.idx > 0) open(state.idx - 1);
  }
});

boot().catch(e => {
  document.body.innerHTML = '<div class="wrap"><p style="padding:40px 0">'
    + 'Could not load the texts: ' + e
    + '<br><br>Serve this folder rather than opening the file directly:<br>'
    + '<code>cd public &amp;&amp; python -m http.server 8000</code></p></div>';
});
</script>
</body>
</html>
